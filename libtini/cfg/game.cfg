# Static full-game layout. ProDOS loads the SYS at $2000, no LC/overlays.
# Constant data is copied once from its initial high load image into unused
# MAIN $0800-$1FFF BEFORE BSS is cleared or the software stack is used.
# ONCE holds entry code that finishes before zerobss; it follows DATA, so
# BSS reuses its bytes.
SYMBOLS {
    __STACKSIZE__: type = export, value = $0800;
    __STACKSTART__: type = export, value = $BF00;
    _ti_readable_start: type = export, value = $2000;
    _ti_writable_start: type = export, value = __OSSTATE_RUN__ + __OSSTATE_SIZE__;
    _ti_osstate_start: type = export, value = __OSSTATE_RUN__;
    _ti_osstate_end: type = export, value = __OSSTATE_RUN__ + __OSSTATE_SIZE__;
    _ti_memory_end: type = export, value = $AF00;
    _ti_readable_low_start: type = export, value = $0800;
    _ti_readable_low_end: type = export, value = $2000;
    _ti_stack_bottom: type = export, value = $B700;
    _ti_stack_top: type = export, value = $BF00;
    _ti_near_start: type = export, value = __NEAR_START__;
    _ti_near_end: type = export, value = __NEAR_START__ + __NEAR_SIZE__;
    _ti_transfer_start: type = export, value = $B400;
    __TRANSFER_START__: type = export, value = $B400;
    __TRANSFER_SIZE__: type = export, value = $0080;
    # The aligned ProDOS I/O buffer for file calls, $B000-$B3FF.
    _ti_file_buffer: type = export, value = $B000;
    __TRAMP_START__: type = export, value = $0140;
    __TRAMP_SIZE__: type = export, value = $0040;
}
MEMORY {
    ZP: file = "", define = yes, start = $0080, size = $001A;
    IMAGE: file = %O, define = yes, start = $2000, size = $9F00;
    LOW: file = "", define = yes, start = $0800, size = $1800;
    WORK: file = "", define = yes, start = __OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__,
          size = $AF00 - (__OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__);
    # The caller near arena. Variables in NEARBSS are zeroed at startup.
    NEAR: file = "", define = yes, start = $B480, size = $0280;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    STARTUP: load = IMAGE, type = ro;
    TINET: load = MAIN, type = ro, optional = yes;
    CODE: load = IMAGE, type = ro;
    TISETUP: load = IMAGE, type = ro, optional = yes;
    TIFILES: load = IMAGE, type = ro, optional = yes;
    OSSTATE: load = IMAGE, type = rw, define = yes;
    DATA: load = IMAGE, type = rw, define = yes;
    ONCE: load = IMAGE, type = ro;
    RODATA: load = IMAGE, run = LOW, type = ro, define = yes;
    AMEMCODE: load = IMAGE, run = LOW, type = ro, define = yes;
    LOWCODE: load = IMAGE, run = LOW, type = ro, define = yes;
    TINETBSS: load = MAIN, type = bss, optional = yes;
    BSS: load = WORK, type = bss, define = yes;
    NEARBSS: load = NEAR, type = bss, define = yes, optional = yes;
}
