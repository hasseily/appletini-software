# Raw ProDOS SYS image. ProDOS loads byte zero at $2000.
# No language-card segment: ProDOS owns MAIN $D000-$FFFF.
SYMBOLS {
    __STACKSIZE__:       type = export, value = $0800;
    __STACKSTART__:      type = export, value = $A800;
    _ti_readable_start:  type = export, value = $2000;
    _ti_writable_start:  type = export, value = __OSSTATE_RUN__ + __OSSTATE_SIZE__;
    _ti_osstate_start:   type = export, value = __OSSTATE_RUN__;
    _ti_osstate_end:     type = export, value = __OSSTATE_RUN__ + __OSSTATE_SIZE__;
    _ti_memory_end:      type = export, value = $A800;
    _ti_readable_low_start: type = export, value = $2000;
    _ti_readable_low_end:   type = export, value = $2000;
    _ti_stack_bottom:    type = export, value = $A000;
    _ti_stack_top:       type = export, value = $A800;
    _ti_near_start:      type = export, value = __NEAR_START__;
    _ti_near_end:        type = export, value = __NEAR_START__ + __NEAR_SIZE__;
    _ti_transfer_start:  type = export, value = $A800;
    __TRANSFER_START__:  type = export, value = $A800;
    __TRANSFER_SIZE__:   type = export, value = $0080;
    # The aligned ProDOS I/O buffer for file calls, $B000-$B3FF.
    _ti_file_buffer: type = export, value = $B000;
    __TRAMP_START__:     type = export, value = $0140;
    __TRAMP_SIZE__:      type = export, value = $0040;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0080, size = $001A;
    MAIN: file = %O, define = yes, start = $2000, size = $8000;
    # The caller near arena. Variables in NEARBSS are zeroed at startup.
    NEAR: file = "", define = yes, start = $A900, size = $0600;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    LOWCODE:  load = MAIN, type = ro, define = yes;
    ONCE:     load = MAIN, type = ro, optional = yes;
    TINET: load = MAIN, type = ro, optional = yes;
    CODE:     load = MAIN, type = ro;
    TISETUP:  load = MAIN, type = ro, optional = yes;
    TIFILES:  load = MAIN, type = ro, optional = yes;
    RODATA:   load = MAIN, type = ro, define = yes;
    AMEMCODE: load = MAIN, type = ro, define = yes;
    OSSTATE:  load = MAIN, type = rw, define = yes;
    DATA:     load = MAIN, type = rw, define = yes, optional = yes;
    TINETBSS: load = MAIN, type = bss, optional = yes;
    BSS:      load = MAIN, type = bss, define = yes;
    NEARBSS:  load = NEAR, type = bss, define = yes, optional = yes;
}
