# STARFALL's layout: cfg/game.cfg with an overlay window, a short C stack and
# a file buffer that borrows the scene storage.
#
# ProDOS loads the SYS at $2000. Resident code and data come first. The
# overlay window follows them and ends at __WINDOWEND__. At load time the
# window starts with the file code and the loader. Overlays from
# STARFALL.PAK replace them, and each one runs from the start of the window.
# Each overlay is linked into a file of its own, and tools/starfall_pack.py
# packs the files with their run addresses. The title overlay also holds the
# library setup code (TISETUP), which only the startup and the launch use.
#
# ONCE and the initial images of the low segments follow the loader in the
# SYS file. Startup copies the low segments to MAIN $0800-$1FFF and runs ONCE
# before BSS is cleared and before the loader runs, so the window and the
# variables reuse those bytes.
#
# The C stack needs less than 100 bytes, so it has 256. The transfer stage
# and the near arena move up below it, and the variables end at $BA7F.
SYMBOLS {
    __STACKSIZE__: type = export, value = $0100;
    __STACKSTART__: type = export, value = $BF00;
    # The overlay window ends here, where the variables begin.
    __WINDOWEND__: type = weak, value = $AC30;
    _ti_readable_start: type = export, value = $2000;
    _ti_writable_start: type = export, value = __OSSTATE_RUN__ + __OSSTATE_SIZE__;
    _ti_osstate_start: type = export, value = __OSSTATE_RUN__;
    _ti_osstate_end: type = export, value = __OSSTATE_RUN__ + __OSSTATE_SIZE__;
    _ti_memory_end: type = export, value = $BA80;
    _ti_readable_low_start: type = export, value = $0800;
    _ti_readable_low_end: type = export, value = $2000;
    _ti_stack_bottom: type = export, value = $BE00;
    _ti_stack_top: type = export, value = $BF00;
    _ti_near_start: type = export, value = __NEAR_START__;
    _ti_near_end: type = export, value = __NEAR_START__ + __NEAR_SIZE__;
    _ti_transfer_start: type = export, value = $BA80;
    __TRANSFER_START__: type = export, value = $BA80;
    __TRANSFER_SIZE__: type = export, value = $0080;
    # File calls run only before the scene starts. Until then the 1856 bytes
    # of the scene storage are idle, and the first whole 1 KiB page range in
    # them is the ProDOS I/O buffer.
    _ti_file_buffer: type = export, value = (__SCENE_RUN__ + 255) / 256 * 256;
    __TRAMP_START__: type = export, value = $0140;
    __TRAMP_SIZE__: type = export, value = $0040;
}
MEMORY {
    ZP: file = "", define = yes, start = $0080, size = $001A;
    IMAGE: file = %O, define = yes, start = $2000, size = __WINDOWEND__ - $2000;
    # The window as ProDOS loads it.
    FILES: file = %O, define = yes, start = __OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__,
           size = __WINDOWEND__ - (__OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__);
    TAIL: file = %O, define = yes, start = __LOADER_RUN__ + __LOADER_SIZE__,
          size = $BF00 - (__LOADER_RUN__ + __LOADER_SIZE__);
    # Overlays.
    TITLE: file = "%O.tit", define = yes, start = __OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__,
           size = __WINDOWEND__ - (__OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__);
    PANELS: file = "%O.pnl", define = yes, start = __OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__,
            size = __WINDOWEND__ - (__OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__);
    PLAY: file = "%O.ply", define = yes, start = __OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__,
          size = __WINDOWEND__ - (__OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__);
    # The boss overlay. The art of its boss follows its variables.
    BOSS: file = "%O.bos", define = yes, start = __OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__,
          size = __WINDOWEND__ - (__OSSTATE_RUN__ + __OSSTATE_SIZE__ + __DATA_SIZE__);
    LOW: file = "", define = yes, start = $0800, size = $1800;
    WORK: file = "", define = yes, start = __WINDOWEND__, size = $BA80 - __WINDOWEND__;
    # The caller near arena. Variables in NEARBSS are zeroed at startup.
    NEAR: file = "", define = yes, start = $BB00, size = $0300;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    STARTUP: load = IMAGE, type = ro;
    CODE: load = IMAGE, type = ro;
    OSSTATE: load = IMAGE, type = rw, define = yes;
    DATA: load = IMAGE, type = rw, define = yes;
    TIFILES: load = FILES, type = ro;
    LOADER: load = FILES, type = ro, define = yes;
    ONCE: load = TAIL, type = ro;
    RODATA: load = TAIL, run = LOW, type = ro, define = yes;
    AMEMCODE: load = TAIL, run = LOW, type = ro, define = yes;
    LOWCODE: load = TAIL, run = LOW, type = ro, define = yes;
    TITLE: load = TITLE, type = ro;
    TISETUP: load = TITLE, type = ro;
    PANELS: load = PANELS, type = ro;
    PLAY: load = PLAY, type = ro;
    BOSS: load = BOSS, type = ro;
    BOSSBSS: load = BOSS, type = bss;
    SCENE: load = WORK, type = bss, define = yes;
    BSS: load = WORK, type = bss, define = yes;
    NEARBSS: load = NEAR, type = bss, define = yes, optional = yes;
}
