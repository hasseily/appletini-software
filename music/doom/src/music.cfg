# ld65 configuration of MUSIC.SYSTEM (music.s, aytime.s, and the player:
# player.s, irq.s, probe.s). The Makefile builds it and makes the disk.
#
# The interrupt touches only the zero page $D8-$FF, the stack,
# $E000-$FFFF, the mouse card and the Phasor; never $D000-$DFFF:
#
#   $00D8-$00FF   the player's zero page (SNDZP, 31 bytes)
#   $E000-$E402   the song ring and its mirror (SNDRING, page aligned)
#   $E480-$E4FF   the write lists (SNDLIST, one page)
#   $E500-$E736   the player's state (SNDBSS)
#   $E900-$F8FF   the player's code and tables (SNDCODE, SNDRODATA)
#   $F900-$FFF9   empty
#   $FFFA-$FFFF   the vectors: IRQ/BRK -> snd_vbl
#
# Files:
#   %O.main   $2000-$3FFF: MUSIC.SYSTEM's own code, run in main memory
#             (the boot under ProDOS, the screen, the keys, the timing test)
#   %O.lc     $E900-$FFFF: the card image; MUSIC.SYSTEM is %O.main then
#             %O.lc, so ProDOS loads the image at $4000 and the boot code
#             copies it into the card once ProDOS is saved
#
# Runtime data of the program lives in main $1000-$1FFF (MUSBSS, not in
# the file): no video page, so the timing test's own stores leave no
# bytes in the card's mirror.

MEMORY {
    MUSZP:   start = $0018, size = $002A, type = rw, file = "";
    SNDZP:   start = $00D8, size = $0028, type = rw, file = "";
    MUSBSS:  start = $1000, size = $1000, type = rw, file = "";
    MAIN:    start = $2000, size = $2000, type = rw, file = "%O.main", fill = yes;
    RING:    start = $E000, size = $0403, type = rw, file = "";
    LIST:    start = $E480, size = $0080, type = rw, file = "";
    STATE:   start = $E500, size = $0240, type = rw, file = "";
    LC:      start = $E900, size = $1000, type = ro, file = "%O.lc", fill = yes;
    REST:    start = $F900, size = $06FA, type = ro, file = "%O.lc", fill = yes;
    VEC:     start = $FFFA, size = $0006, type = ro, file = "%O.lc";
}

SEGMENTS {
    MUSZP:     load = MUSZP,  type = zp;
    SNDZP:     load = SNDZP,  type = zp;
    MUSBSS:    load = MUSBSS, type = bss, align = $100;
    MUSCODE:   load = MAIN,   type = ro;
    MUSDATA:   load = MAIN,   type = ro;
    SNDBOOT:   load = MAIN,   type = ro;
    SNDRING:   load = RING,   type = bss, align = $100;
    SNDLIST:   load = LIST,   type = bss;
    SNDBSS:    load = STATE,  type = bss;
    SNDCODE:   load = LC,     type = ro;
    SNDRODATA: load = LC,     type = ro;
    VECTORS:   load = VEC,    type = ro;
}
