MEMORY {
    ZP: start = $0080, size = $0010, type = rw, file = "";
    STATE: start = $1000, size = $0C00, type = rw, file = "";
    RAM: start = $2000, size = $1000, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE: load = RAM, type = ro;
    RODATA: load = RAM, type = ro;
    BSS: load = STATE, type = bss, define = yes;
}
