MEMORY {
 MAIN: file="main.bin", start=$0200, size=$1E00, fill=yes;
 A: file="a.bin", start=$D000, size=$3000, fill=yes;
 B: file="b.bin", start=$D000, size=$3000, fill=yes;
 LC: file="lc.bin", start=$D000, size=$3000, fill=yes;
}
SEGMENTS {
 FIXTURE: load=MAIN,type=rw;
 GBANKCODE: load=MAIN,type=rw;
 COMMON: load=MAIN,type=rw,start=$1200;
 GBANKBSS: load=MAIN,type=bss;
 BANKA: load=A,type=ro;
 CALLBACKA: load=A,type=ro,start=$D500;
 BANKB: load=B,type=ro;
 MAINLC: load=LC,type=ro;
}
