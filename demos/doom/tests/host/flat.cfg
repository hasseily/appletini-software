# Flat memory map for the py65 harness of the GAME code (tests/host/gamesim.py).
#
# The game's cc65 build runs here without the Apple: its C and assembly
# at $0200-$D7FF (larger than the GAME space, so that code that does not
# fit it yet can still be run and measured), the C stack at $D800-$DFFF,
# and at $E000 a stand-in for the kernel's jump table whose entries stop
# on trap addresses that the harness services (far memory is Python's).
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0800;
    __STACKSTART__: type = weak, value = $E000;
}
MEMORY {
    KZP:  file = "", define = yes, start = $0002, size = $00DE, type = rw;
    CZP:  file = "", define = yes, start = $00E0, size = $0020, type = rw;
    RAM:  file = %O, define = yes, start = $0200, size = $D600, type = rw;
    KERN: file = "%O.kern", define = yes, start = $E000, size = $1F00, type = rw;
}
SEGMENTS {
    KZP:      load = KZP,  type = zp;
    GZP:      load = KZP,  type = zp, optional = yes;
    ZEROPAGE: load = CZP,  type = zp;
    STARTUP:  load = RAM,  type = ro;
    LOWCODE:  load = RAM,  type = ro, optional = yes;
    ONCE:     load = RAM,  type = ro, optional = yes;
    CODE:     load = RAM,  type = ro;
    RODATA:   load = RAM,  type = ro;
    DATA:     load = RAM,  type = rw, define = yes;
    GFAR:     load = RAM,  type = ro, define = yes, optional = yes;
    INIT:     load = RAM,  type = bss, optional = yes;
    BSS:      load = RAM,  type = bss, define = yes;
    KJT:      load = KERN, type = rw, start = $E000;
    KCODE:    load = KERN, type = rw;
    KBSS:     load = KERN, type = bss;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA,
            import = __CALLIRQ__;
}
