# The GAME space as src/doom.cfg has it, for the game alone
# (tests/test_game_core.py: GameSpaceTest): RamWorks bank 1 $0200-$B7FF,
# the C stack above it, the kernel's jump table at $E000 (the stand-in of
# flatkern.s, as in flat.cfg). The segments are doom.cfg's GAME ones; the
# zero page is only what the game and cc65 take (the kernel's and the
# renderer's share of KZP is checked by the full link).
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0800;
    __STACKSTART__: type = weak, value = $C000;
}
MEMORY {
    KZP:  file = "", define = yes, start = $0002, size = $00DE, type = rw;
    CZP:  file = "", define = yes, start = $00E0, size = $0020, type = rw;
    GAME: file = %O, define = yes, start = $0200, size = $B600, type = rw;
    KERN: file = "%O.kern", define = yes, start = $E000, size = $1F00, type = rw;
}
SEGMENTS {
    KZP:      load = KZP,  type = zp;
    GZP:      load = KZP,  type = zp, optional = yes;
    ZEROPAGE: load = CZP,  type = zp;
    STARTUP:  load = GAME, type = ro;
    LOWCODE:  load = GAME, type = ro, optional = yes;
    ONCE:     load = GAME, type = ro, optional = yes;
    CODE:     load = GAME, type = ro;
    RODATA:   load = GAME, type = ro;
    DATA:     load = GAME, type = rw, define = yes;
    GFAR:     load = GAME, type = ro, define = yes, optional = yes;
    GOVL:     load = GAME, type = ro, define = yes, optional = yes;
    INIT:     load = GAME, type = bss, optional = yes;
    BSS:      load = GAME, type = bss, define = yes;
    KJT:      load = KERN, type = rw, start = $E000;
    KCODE:    load = KERN, type = rw;
    KBSS:     load = KERN, type = bss;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA,
            import = __CALLIRQ__;
}
