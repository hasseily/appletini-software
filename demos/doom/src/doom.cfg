# Linker configuration of the Doom port (docs/DESIGN.md sections 4 and 8).
#
# One link, four output files. Every symbol resolves across all of them:
# the loader jumps to kernel_start, the kernel calls _game_tic, the game's
# C code reads the kernel's input block, all by name. The output name given
# to ld65 is the build directory with its slash (-o build/): the files are
#
#   DOOM.SYSTEM   the ProDOS loader, runs at $2000 under ProDOS
#   RENDER.BIN    main memory $0200-$8B7F (RENDER space)
#   LC.BIN        the main language card, 16 KB in a fixed order:
#                 bank 2 $D000-$DFFF, $E000-$FFFF, bank 1 $D000-$DFFF
#   GAME.BIN      RamWorks bank 1 $0200-$B7FF (GAME space)
#
# RENDER.BIN and GAME.BIN are images from
# $0200 up to their last byte (the areas before the last are filled), so
# the loader copies them page for page; LC.BIN is always 16,384 bytes.
#
# Segment ownership: cc65's standard segments (STARTUP, LOWCODE, ONCE,
# CODE, RODATA, DATA, BSS, INIT, ZEROPAGE) belong to the GAME space and
# the C runtime; the kernel and the renderer name their segments
# explicitly (K*, R*, LDR*) and never use the defaults.
#
# Zero page: $02-$DF (KZP) is the kernel's and the renderer's; $E0-$FF is
# cc65's ZEROPAGE (sp, sreg, regsave, ptr1-4, tmp1-4, regbank: 26 bytes).
# Page 1 is the 6502 stack (shared by both spaces; the loader's installer
# runs at $0100 before the kernel owns the machine).

SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0800;     # cc65 software stack, GAME space
    __STACKSTART__: type = weak, value = $C000;     # grows down to $B800 (bank 1)
    VIEWBUF:        type = export, value = $8B80;   # 160 x 84 column-major view buffer
    # the render packet (src/game/rview.h) until the GAME space defines it
    _rview:         type = weak,   value = $B000;
    VIEWBUF_SIZE:   type = export, value = $3480;   # 13,440 bytes, ends at $BFFF
}

MEMORY {
    # zero page (not in any file)
    KZP:     file = "", define = yes, start = $0002, size = $00DE, type = rw;
    CZP:     file = "", define = yes, start = $00E0, size = $0020, type = rw;

    # the loader
    LOADER:  file = "%ODOOM.SYSTEM", define = yes, start = $2000, size = $2000, type = rw;

    # RENDER space: main memory
    RLOW:    file = "%ORENDER.BIN", define = yes, start = $0200, size = $0200, fill = yes, type = rw;
    RTEXT:   file = "%ORENDER.BIN", define = yes, start = $0400, size = $0800, fill = yes, type = ro;
    RMAIN:   file = "%ORENDER.BIN", define = yes, start = $0C00, size = $7F80, type = rw;
    RVIEW:   file = "", define = yes, start = $8B80, size = $3480, type = rw;

    # the main language card (bank 2 $D000, $E000-$FFFF with the vectors, bank 1 $D000)
    LC2:     file = "%OLC.BIN", define = yes, start = $D000, size = $1000, fill = yes, type = rw;
    LCHI:    file = "%OLC.BIN", define = yes, start = $E000, size = $1FFA, fill = yes, type = rw;
    LCVEC:   file = "%OLC.BIN", define = yes, start = $FFFA, size = $0006, fill = yes, type = ro;
    LC1:     file = "%OLC.BIN", define = yes, start = $D000, size = $1000, fill = yes, type = rw;

    # GAME space: RamWorks bank 1 (the C stack is above, $B800-$BFFF)
    GAME:    file = "%OGAME.BIN", define = yes, start = $0200, size = $B600, type = rw;
}

SEGMENTS {
    KZP:       load = KZP,    type = zp;
    GZP:       load = KZP,    type = zp,  optional = yes;   # the game's (src/game/fixed.s)
    ZEROPAGE:  load = CZP,    type = zp;

    LDRCODE:   load = LOADER, type = rw;

    RLOWDATA:  load = RLOW,   type = rw,  optional = yes;
    RTEXTDATA: load = RTEXT,  type = ro,  optional = yes;
    # RENDER main $0C00-$8B7F: writes to $2000-$5FFF are mirrored to the
    # motherboard (slow), so that window holds only read-only data and code:
    #   $0C00-$1FBB  RLOBSS    renderer buffers (rw: zeros in the file, so what
    #                          follows keeps its place; not cleared by the kernel)
    #   $1FBC-       RRODATA   the generated tables (tables.s); the start puts
    #                          the quarter-square tables on page boundaries
    #                          (src/render/rmath.s asserts it)
    #   then         RCODE     read-only code, up to $5FFF
    #   $6000-$8B7F  RHICODE   code with self-modified operands, RDATA, RBSS
    RLOBSS:    load = RMAIN,  type = rw,  define = yes, optional = yes;
    RRODATA:   load = RMAIN,  type = ro,  optional = yes, start = $1FBC;
    RCODE:     load = RMAIN,  type = ro;
    RHICODE:   load = RMAIN,  type = rw,  start = $6000;
    RDATA:     load = RMAIN,  type = rw,  optional = yes;
    RBSS:      load = RMAIN,  type = bss, define = yes, optional = yes;
    RVIEWBUF:  load = RVIEW,  type = bss, optional = yes;

    KLC2:      load = LC2,    type = rw,  optional = yes;
    KJT:       load = LCHI,   type = ro,  start = $E000;
    KCODE:     load = LCHI,   type = rw;
    KRODATA:   load = LCHI,   type = ro,  optional = yes;
    KDATA:     load = LCHI,   type = rw,  optional = yes;
    KBSS:      load = LCHI,   type = bss, define = yes;
    KVECTORS:  load = LCVEC,  type = ro;
    RLC2:      load = LC2,    type = rw,  optional = yes;   # renderer, after the blit
    RLCHI:     load = LCHI,   type = rw,  optional = yes;   # renderer code and data seen by both spaces
    RLCBSS:    load = LCHI,   type = bss, optional = yes;   # renderer buffers (not cleared)
    KLC1:      load = LC1,    type = rw,  optional = yes;
    RLC1:      load = LC1,    type = rw,  optional = yes;   # renderer inner loops (RAMRD-safe)

    STARTUP:   load = GAME,   type = ro;
    LOWCODE:   load = GAME,   type = ro,  optional = yes;
    ONCE:      load = GAME,   type = ro,  optional = yes;
    CODE:      load = GAME,   type = ro;
    RODATA:    load = GAME,   type = ro;
    DATA:      load = GAME,   type = rw,  define = yes;
    # the game's far tables (src/game/gtables.s): in GAME.BIN, copied at
    # boot into the game's own bank; afterwards level memory (p_setup.c)
    GFAR:      load = GAME,   type = ro,  define = yes, optional = yes;
    INIT:      load = GAME,   type = bss, optional = yes;
    BSS:       load = GAME,   type = bss, define = yes;
}

FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA,
            import = __CALLIRQ__;
}
