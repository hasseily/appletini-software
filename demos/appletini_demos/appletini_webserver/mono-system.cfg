# A2MONO high-memory AppleSingle payload. The build wraps this with a
# $2000 ProDOS SYS relocation loader before packaging the executable.
# MAIN/AUX $2000-$5FFF belong to the two DHGRi page pairs (32 KiB total).
# Resident CODE/RODATA/DATA: MAIN $6000-$8AFF.
# Browser and image overlays share MAIN $8B00-$B6FF. The builder replaces
# @MONO.*@ with paths inside its output directory before invoking ld65.
# Software stack: $B700-$BEFF.
# Resident BSS uses MAIN $0880-$15FF. The unused lores A2Li signal hole
# at $0878-$087C stays outside mutable program data. Codec workspaces
# share $1600-$1FFF;
# each decoder must initialize its own workspace on entry.
# The overlay loader borrows $1C00-$1FFF only while no decoder runs.
# The prototype does not allocate a C heap; persistent work uses static/AUX RAM.
# AUX $6000-$9FFF is the image decoder workspace; AUX $A000-$BFFF is HTML.
SYMBOLS {
    __EXEHDR__: type = import;
    __FILETYPE__: type = weak, value = $00FF;
    __STACKSIZE__: type = weak, value = $0800;
    __LCADDR__: type = weak, value = $D400;
    __LCSIZE__: type = weak, value = $0C00;
}
MEMORY {
    ZP: file = "", define = yes, start = $0080, size = $001A;
    HEADER: file = %O, start = $6000 - $003A, size = $003A;
    # ONCE and the initial LC copy may stage above $8AFF. Startup consumes
    # them before it loads the first overlay. The builder checks that all
    # permanent resident segments end before $8B00.
    MAIN: file = %O, define = yes, start = $6000, size = $B700 - $6000;
    WEBMEM: file = "@MONO.WEB@", define = yes, start = $8B00, size = $2C00;
    GIFMEM: file = "@MONO.GIF@", define = yes, start = $8B00, size = $2C00;
    PNGMEM: file = "@MONO.PNG@", define = yes, start = $8B00, size = $2C00;
    JPGMEM: file = "@MONO.JPG@", define = yes, start = $8B00, size = $2C00;
    NETMEM: file = "@MONO.NET@", define = yes, start = $8B00, size = $2C00;
    BSS: file = "", start = $0880, size = $0D80;
    GIFWORK: file = "", start = $1600, size = $0A00;
    PNGWORK: file = "", start = $1600, size = $0A00;
    JPGWORK: file = "", start = $1600, size = $0A00;
    NETWORK: file = "", start = $1600, size = $0600;
    LC: file = "", define = yes, start = __LCADDR__, size = __LCSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    EXEHDR: load = HEADER, type = ro, optional = yes;
    STARTUP: load = MAIN, type = ro;
    LOWCODE: load = MAIN, type = ro, optional = yes;
    CODE: load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    DATA: load = MAIN, type = rw;
    INIT: load = MAIN, type = rw;
    ONCE: load = MAIN, type = ro, define = yes;
    LC: load = MAIN, run = LC, type = ro, optional = yes;
    BROWSER: load = WEBMEM, type = ro, define = yes;
    GIF: load = GIFMEM, type = ro, define = yes, optional = yes;
    PNG: load = PNGMEM, type = ro, define = yes, optional = yes;
    JPEG: load = JPGMEM, type = ro, define = yes, optional = yes;
    NET: load = NETMEM, type = ro, define = yes;
    BSS: load = BSS, type = bss, define = yes;
    GIFBSS: load = GIFWORK, type = bss, define = yes, optional = yes;
    PNGBSS: load = PNGWORK, type = bss, define = yes, optional = yes;
    JPEGBSS: load = JPGWORK, type = bss, define = yes, optional = yes;
    NETBSS: load = NETWORK, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA,
            import = __CALLIRQ__;
}
