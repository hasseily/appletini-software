# ld65 configuration of the 65816 interpreter (vm.s). The sizes of the
# code areas are the budget of docs/ARCHITECTURE.md section 3.2: 4 KB of
# core in the main language card at $E000, the far layer (1.2 KB of the
# same card), and 4 KB of opcode handlers in language card bank 1 at
# $D000. Code that outgrows an area fails the link.
#
# Each code area is written to a file of its own: vm.bin.d000 (bank 1),
# vm.bin.e000 (core) and vm.bin.f000 (far layer), loaded at those
# addresses. The rest is main RAM the interpreter uses, never loaded.

MEMORY {
    ZP:     start = $0050, size = $0060, type = rw, file = "";
    TAB:    start = $1600, size = $0200, type = rw, file = "";
    RAM:    start = $1800, size = $0200, type = rw, file = "";
    LC1:    start = $D000, size = $1000, type = ro, file = "%O.d000";
    CORE:   start = $E000, size = $1000, type = ro, file = "%O.e000";
    FAR:    start = $F000, size = $04CC, type = ro, file = "%O.f000";
}

SEGMENTS {
    VMZP:     load = ZP,   type = zp;
    VMTAB:    load = TAB,  type = bss;
    VMRAM:    load = RAM,  type = bss;
    HANDLERS: load = LC1,  type = ro;
    CORE:     load = CORE, type = ro;
    CORETAIL: load = CORE, type = ro;     # cold paths, after the core
    FAR:      load = FAR,  type = ro;
}
