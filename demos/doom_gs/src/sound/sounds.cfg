# ld65 configuration of SOUNDS.SYSTEM, the effects' test disk (milestone
# 11, part fxdisk): sounds.s, S2's player (player.o, probe.o from
# build/sound65, read only), pl_irq.s (pl_vbl, the clock) and fx.s (its
# card part and fx_service). src/native/m11/fxdisk.mk links it;
# tools/sound/fxdisk.py makes the disk and checks these places against
# tools/native/s2layout.py (the game's: docs/SCREENS.md 4.3, 4.4).
#
#   $0018-$003F   SOUNDS.SYSTEM's zero page
#   $00D8-$00F6   S2's zero page and pl_irq's vbl_count (SNDZP); the
#                 effects' interrupt uses $F7-$FC (s2.inc FX_ZP)
#   $1000-$1FFF   SOUNDS.SYSTEM's data (SDSBSS), not in the file
#   $2000-$3FFF   SOUNDS.SYSTEM: its code and data, fx_service (S2CODE),
#                 S2's probe (SNDBOOT)
#   $E000-$E402   the song ring and its mirror (SNDRING)
#   $E403-$E412   the clock (pl_irq.s, s2.inc CLK_*)
#   $E413-$E442   the effect voices (fx.s, s2.inc FXV_BASE)
#   $E480-$E4FF   S2's write lists (SNDLIST)
#   $E500-$E736   S2's state (SNDBSS)
#   $E737-$E8BF   the effects' state and rings (fx.s, s2.inc)
#   $E8C0-$E8EF   the channel table and the mailboxes (s2.inc SC_*)
#   $E900-$F504   S2's code and tables (SNDCODE, SNDRODATA)
#   $F505-$F8FF   pl_vbl and fx.s's card part (FXCODE)
#   $F900-$FFF9   empty here (the game's replay and platform code)
#   $FFFA-$FFFF   the vectors (pl_irq.s: NMI, reset, IRQ -> pl_vbl)
#
# Files: %O.main is $2000-$3FFF and %O.lc the card image $E900-$FFFF;
# SOUNDS.SYSTEM is %O.main then %O.lc, so ProDOS loads the image at $4000
# and the boot copies it into the card once ProDOS's card is saved.

MEMORY {
    SDSZP:   start = $0018, size = $0028, type = rw, file = "";
    SNDZP:   start = $00D8, size = $001F, type = rw, file = "";
    SDSBSS:  start = $1000, size = $1000, type = rw, file = "";
    MAIN:    start = $2000, size = $2000, type = rw, file = "%O.main", fill = yes;
    RING:    start = $E000, size = $0403, type = rw, file = "";
    LIST:    start = $E480, size = $0080, type = rw, file = "";
    STATE:   start = $E500, size = $0237, type = rw, file = "";
    SND:     start = $E900, size = $0C05, type = ro, file = "%O.lc", fill = yes;
    FXC:     start = $F505, size = $03FB, type = ro, file = "%O.lc", fill = yes;
    REST:    start = $F900, size = $06FA, type = ro, file = "%O.lc", fill = yes;
    VEC:     start = $FFFA, size = $0006, type = ro, file = "%O.lc";
}

SEGMENTS {
    SDSZP:     load = SDSZP,  type = zp;
    SNDZP:     load = SNDZP,  type = zp;
    SDSBSS:    load = SDSBSS, type = bss, align = $100;
    SDSCODE:   load = MAIN,   type = ro;
    S2CODE:    load = MAIN,   type = ro, define = yes;
    SDSDATA:   load = MAIN,   type = ro;
    SNDBOOT:   load = MAIN,   type = ro;
    SNDRING:   load = RING,   type = bss, align = $100;
    SNDLIST:   load = LIST,   type = bss;
    SNDBSS:    load = STATE,  type = bss;
    SNDCODE:   load = SND,    type = ro;
    SNDRODATA: load = SND,    type = ro;
    FXCODE:    load = FXC,    type = ro, define = yes;
    VECTORS:   load = VEC,    type = ro;
}
