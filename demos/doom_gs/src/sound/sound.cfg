# ld65 configuration of the music player (player.s, irq.s) and its test
# driver (driver.s), for tools/sound/run65.py and a2vm.
#
# The player lives in the main language card: its code, tables and
# vectors at $E000-$FFFF (written to sound.lc, loaded at $E000), its ring,
# write lists and state in bank 2 at $D000 (not loaded: snd_init and
# snd_start set what they use). Its zero page is at $80. Where the game
# puts it is milestone 5's language-card map (NATIVE.md 4.1); nothing in
# the player depends on these addresses but the ring's page alignment and
# the write lists staying in one page (player.s checks it at link time).
#
# The driver and the probe (boot code) are main memory at $0800
# (sound.main).

MEMORY {
    ZP:      start = $0080, size = $0040, type = rw, file = "";
    MAIN:    start = $0800, size = $1000, type = rw, file = "%O.main";
    LCBSS:   start = $D000, size = $1000, type = rw, file = "";
    LC:      start = $E000, size = $1FFA, type = ro, file = "%O.lc", fill = yes;
    VEC:     start = $FFFA, size = $0006, type = ro, file = "%O.lc";
}

SEGMENTS {
    SNDZP:     load = ZP,    type = zp;
    DRVZP:     load = ZP,    type = zp;
    DRVCODE:   load = MAIN,  type = rw;
    DRVDATA:   load = MAIN,  type = rw;
    SNDBOOT:   load = MAIN,  type = rw;
    SNDRING:   load = LCBSS, type = bss, align = $100;
    SNDLIST:   load = LCBSS, type = bss;
    SNDBSS:    load = LCBSS, type = bss;
    SNDCODE:   load = LC,    type = ro;
    SNDRODATA: load = LC,    type = ro;
    VECTORS:   load = VEC,   type = ro;
}
