# ld65 map of the native math's a2vm test build (src/native/MATH.md):
# the math at the places of docs/MEMORY_MAP.md, so an overflow of a
# budget fails the link, and the test driver in the card's $E000 part.
MEMORY {
    # main card bank 1: the products ($D800-$DBFF, MEMORY_MAP 4.2)
    LC1:  start = $D800, size = $0400, file = "%O.lc1";
    # the far layer's area of bank 1 ($DC00-$DFFF): the table reads
    FAR:  start = $DC00, size = $0400, file = "%O.far";
    # a code window of main memory (W, $6000-$BFFF); the test puts its
    # cases at $8000 and its results at $A000
    W:    start = $6000, size = $2000, file = "%O.w";
    # the card's $E000 part: the test driver (not the game's)
    LCE:  start = $E000, size = $0800, file = "%O.lce";
    DSC:  start = $E800, size = $0100, file = "%O.dsc";
}
SEGMENTS {
    MATHLC:  load = LC1, type = ro;
    MATHFAR: load = FAR, type = ro;
    MATHRND: load = W,   type = ro, align = $100;
    MATHW:   load = W,   type = ro;
    DRIVER:  load = LCE, type = ro;
    DESC:    load = DSC, type = bss, define = yes;
}
