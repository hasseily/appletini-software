# ld65 configuration of REPLAY.SYSTEM, the native replay on the card
# (replay.s, runner.s). The replay's areas are those of replay.cfg
# (docs/MEMORY_MAP.md section 8); the runner takes the place of the test
# driver at $E000.
#
# Files (tools/native/disk.py makes the disk from them):
#   %O.boot      $2000-$27FF: the boot code, run under ProDOS
#   %O.lc        $D000-$FFFF (bank 2 at $D000): installed by the boot code
#                from $2800 of REPLAY.SYSTEM (= %O.boot then %O.lc)
#   %O.main0800, %O.aux0200, %O.aux0800   as replay.cfg

MEMORY {
    IRQZP:   start = $00D8, size = $0003, type = rw, file = "";
    RUNZP:   start = $0018, size = $001C, type = rw, file = "";
    RZP:     start = $0048, size = $0028, type = rw, file = "";
    RSCR:    start = $17C2, size = $003E, type = rw, file = "";
    BOOT:    start = $2000, size = $0800, type = rw, file = "%O.boot", fill = yes;
    MAINTAB: start = $0800, size = $0400, type = ro, file = "%O.main0800";
    AUXCODE: start = $0200, size = $0200, type = ro, file = "%O.aux0200";
    AUXTAB:  start = $0800, size = $0400, type = ro, file = "%O.aux0800";
    TEXBLK:  start = $D000, size = $0C00, type = ro, file = "%O.lc", fill = yes;
    FILLE:   start = $DC00, size = $0100, type = ro, file = "%O.lc", fill = yes;
    FILLO:   start = $DD00, size = $0100, type = ro, file = "%O.lc", fill = yes;
    HOT:     start = $DE00, size = $0200, type = ro, file = "%O.lc", fill = yes;
    RUNNER:  start = $E000, size = $0A00, type = ro, file = "%O.lc", fill = yes;
    RUNBSS:  start = $EA00, size = $0F00, type = rw, file = "%O.lc", fill = yes;
    RCODE:   start = $F900, size = $0600, type = ro, file = "%O.lc", fill = yes;
    PLAT:    start = $FF00, size = $00FA, type = ro, file = "%O.lc", fill = yes;
    VEC:     start = $FFFA, size = $0006, type = ro, file = "%O.lc";
}

SEGMENTS {
    IRQZP:   load = IRQZP,   type = zp;
    RUNZP:   load = RUNZP,   type = zp;
    RZP:     load = RZP,     type = zp;
    RSCR:    load = RSCR,    type = bss;
    BOOT:    load = BOOT,    type = rw;
    MAINTAB: load = MAINTAB, type = ro;
    AUXCODE: load = AUXCODE, type = ro;
    AUXTAB:  load = AUXTAB,  type = ro;
    TEXBLK:  load = TEXBLK,  type = ro;
    FILLE:   load = FILLE,   type = ro;
    FILLO:   load = FILLO,   type = ro;
    RHOT:    load = HOT,     type = ro;
    RUNNER:  load = RUNNER,  type = ro;
    RUNBSS:  load = RUNBSS,  type = bss, define = yes;
    RCODE:   load = RCODE,   type = ro;
    VECTORS: load = VEC,     type = ro;
}
