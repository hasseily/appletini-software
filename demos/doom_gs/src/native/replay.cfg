# ld65 configuration of the native replay with its a2vm test driver
# (replay.s, driver.s). The areas are docs/MEMORY_MAP.md section 8; a part
# that outgrows its area fails the link, and `make sizes` prints the room
# left in each.
#
# Files (tools/native/loader.py puts them into an a2vm image):
#   %O.lc        the main language card $D000-$FFFF, bank 2 at $D000
#   %O.main0800  main $0800-$0BFF: CMPA, CMPB, TEXLO, TEXHI
#   %O.aux0200   aux bank 0 $0200-$02BF: the fuzz and overlay drawers (the
#                fuzz queue at $02C0-$03FF is the replay's, never loaded:
#                tools/native/layout.py FUZZQ)
#   %O.aux0800   aux bank 0 $0800-$0BFF: FUZZDARK (zero), ROWLO, FZDIR, ROWHI

MEMORY {
    RZP:     start = $0048, size = $0028, type = rw, file = "";
    DZP:     start = $0018, size = $0008, type = rw, file = "";
    RSCR:    start = $17C2, size = $003E, type = rw, file = "";
    MAINTAB: start = $0800, size = $0400, type = ro, file = "%O.main0800";
    AUXCODE: start = $0200, size = $00C0, type = ro, file = "%O.aux0200";
    AUXTAB:  start = $0800, size = $0400, type = ro, file = "%O.aux0800";
    TEXBLK:  start = $D000, size = $0C00, type = ro, file = "%O.lc", fill = yes;
    FILLE:   start = $DC00, size = $0100, type = ro, file = "%O.lc", fill = yes;
    FILLO:   start = $DD00, size = $0100, type = ro, file = "%O.lc", fill = yes;
    HOT:     start = $DE00, size = $0200, type = ro, file = "%O.lc", fill = yes;
    DRIVER:  start = $E000, size = $1900, type = ro, file = "%O.lc", fill = yes;
    RCODE:   start = $F900, size = $0600, type = ro, file = "%O.lc", fill = yes;
    PLAT:    start = $FF00, size = $00FA, type = ro, file = "%O.lc", fill = yes;
    VEC:     start = $FFFA, size = $0006, type = ro, file = "%O.lc";
}

SEGMENTS {
    RZP:     load = RZP,     type = zp;
    DZP:     load = DZP,     type = zp;
    RSCR:    load = RSCR,    type = bss;
    MAINTAB: load = MAINTAB, type = ro;
    AUXCODE: load = AUXCODE, type = ro;
    AUXTAB:  load = AUXTAB,  type = ro;
    TEXBLK:  load = TEXBLK,  type = ro;
    FILLE:   load = FILLE,   type = ro;
    FILLO:   load = FILLO,   type = ro;
    RHOT:    load = HOT,     type = ro;
    DRIVER:  load = DRIVER,  type = ro;
    RCODE:   load = RCODE,   type = ro;
    VECTORS: load = VEC,     type = ro;
}
