# ld65 map of the bucket pass alone (docs/RENDER-MASKED.md 3.4, 5.1; stage
# C: src/native/bucket.s as the whole frame runs it), for
# tools/native/bucketcheck.py: the code that runs inside a window (BKNEAR)
# in the card's $F900 part after milestone 5's replay ($F900-$FD8C: 1,165
# bytes; 371 left; the renderer's game build, -D RELEASE, adds 62 B to the
# replay and 63 to BKNEAR: $F900-$FEF7), the rest where nm_bkload puts it after the masked phase
# (BKFAR in main $0C00-$0EFF, BKFAR2 in $0200-$02FF), loaded there at once
# (load = run); nm_bkload itself (the masked image's) and the test driver,
# with its stand-in for the replay, in the card's $E000 part (the game's
# sound code: not the game's).
MEMORY {
    NEAR:    start = $FD8D, size = $0173, file = "%O.near";
    FAR:     start = $0C00, size = $0300, file = "%O.bfar";
    FAR2:    start = $0200, size = $0100, file = "%O.bfar2";
    DRV:     start = $E000, size = $0200, file = "%O.drv";
}
SEGMENTS {
    BKNEAR:  load = NEAR, type = ro, define = yes;
    BKFAR:   load = FAR,  type = ro, define = yes;
    BKFAR2:  load = FAR2, type = ro, define = yes;
    BDRIVER: load = DRV,  type = ro, define = yes;
    MASKW:   load = DRV,  type = ro, define = yes;
}
