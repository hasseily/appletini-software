# ld65's map of CALIB.SYSTEM (src/native/calib.s, docs/results/calib.md):
# one file loaded by ProDOS at $2000 and entered there. The card part
# (LCCODE) is copied to $E000 at start; the play build's bytes (PAYLOAD)
# to their own places; PRED (a2vm's figures) comes last, so that its
# contents move no address. GPL-2, the port's own.
MEMORY {
    ZP:    start = $0010, size = $0070, type = rw;
    BSS:   start = $1000, size = $1000, type = rw;
    MAIN:  start = $2000, size = $6000, type = ro, file = %O;
    LC:    start = $E000, size = $1000, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = BSS,  type = bss;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    LCCODE:   load = MAIN, run = LC, type = rw, define = yes;
    PAYLOAD:  load = MAIN, type = ro;
    PRED:     load = MAIN, type = ro;
}
