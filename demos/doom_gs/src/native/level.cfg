# ld65 map of the level load's builds (milestone 9, docs/LEVELS.md 4.1,
# 4.2): every region the load phase takes, so an overflow fails the link.
# The zero page, the load's W data and the store's places are
# rlayout.inc's and llayout.inc's (tools/native/rlayout.py, llayout.py),
# not segments.
MEMORY {
    # W, the load phase's mode window (MEMORY_MAP.md 3.5): MATHW and AUXW
    # from $6000 (the render images' bytes), then the load code from
    # $6600 to $9FFF (llayout.LW_CODE, LW_CODE_END); its data from $A000
    W:    start = $6000, size = $0600, file = "%O.w";
    LW:   start = $6600, size = $3A00, file = "%O.lw";
    # main card bank 1: the products ($D800-$DBFF, MEMORY_MAP 4.2)
    LC1:  start = $D800, size = $0400, file = "%O.lc1";
    # the far layer's $DC00-$DFFF: MATHFAR, then far.s (unchanged: the
    # load adds nothing to the card, docs/LEVELS.md 4.2)
    FAR:  start = $DC00, size = $0400, file = "%O.far";
    # the card's $E000 part: the test driver (not the game's), or the boot
    # disk's runner (lboot.s, the build lcard)
    LCE:  start = $E000, size = $1900, file = "%O.lce";
    VEC:  start = $FFFA, size = $0006, file = "%O.vec";
    # the boot disk's boot code under ProDOS (lcard)
    BOOT: start = $2000, size = $0800, file = "%O.boot", fill = yes;
}
SEGMENTS {
    MATHLC:  load = LC1, type = ro;
    MATHFAR: load = FAR, type = ro;
    RFAR:    load = FAR, type = rw;
    RLOAD:   load = FAR, type = ro;
    MATHW:   load = W,   type = ro, define = yes;
    AUXW:    load = W,   type = rw, define = yes;
    LOADW:   load = LW,  type = rw, define = yes;
    DRIVER:  load = LCE, type = rw;
    DESC:    load = LCE, type = bss, define = yes, align = $100;
    VECTORS: load = VEC, type = ro, optional = yes;
    BOOT:    load = BOOT, type = rw, optional = yes;
}
SYMBOLS {
    # far.s's far_wload names the render window's code; the load phase
    # has none (it loads its own image with far_pload)
    __RENDERW_RUN__:  type = export, value = $6600;
    __RENDERW_SIZE__: type = export, value = 0;
}
