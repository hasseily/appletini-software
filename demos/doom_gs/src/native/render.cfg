# ld65 map of the native renderer's links, rcard and m11/s2ovl.mk's ovf
# (docs/RENDER.md;
# docs/RENDER-MASKED.md): every region of docs/MEMORY_MAP.md
# the renderer takes, so an overflow of a budget fails the link. The zero
# page, the frame block and the tables are rlayout.inc's
# (tools/native/rlayout.py), not segments.
MEMORY {
    # W, the render window: code, $6000-$AFBF (the per-level tables
    # $AFC0-$B8FF and the batch buffer come after it: wtables.img). It
    # starts with what both W images run (MATHW, the math's render subset,
    # and AUXW, the aux card's reads), which the masked phase's load
    # leaves in place, then the front end's code
    W:    start = $6000, size = $4FC0, file = "%O.w";
    # W in the masked phase: its code from MCODE ($6800,
    # rlayout.py), to DSW at $9C00; the masked image of RamWorks bank
    # MCODE_BANK (with the level's TXMP, mtables.img). The whole frame's
    # links also carry the bucket pass's BKFAR there (its load
    # address), which nm_bkload copies to main $0C00 after the masked
    # phase (its run addresses, BFAR and BFAR2); far_mload loads to the
    # area's end
    WM:   start = $6800, size = $3400, file = "%O.wm", define = yes;
    BFAR: start = $0C00, size = $0300, file = "";
    BFAR2: start = $0200, size = $0100, file = "";
    # main card bank 1: the products ($D800-$DBFF, MEMORY_MAP.md)
    LC1:  start = $D800, size = $0400, file = "%O.lc1";
    # the far layer's $DC00-$DFFF: MATHFAR, then far.s
    FAR:  start = $DC00, size = $0400, file = "%O.far";
    # the card's $E000 part: a driver, not the game's: in rcard the card
    # runner (rrunner.s, RENDER.SYSTEM), in ovf rdriver.s and s2_ovd.s
    LCE:  start = $E000, size = $1900, file = "%O.lce";
    VEC:  start = $FFFA, size = $0006, file = "%O.vec";
    # the card runner's boot code under ProDOS (rcard)
    BOOT: start = $2000, size = $0800, file = "%O.boot", fill = yes;
    # the whole frame (RENDER-MASKED.md): the replay at
    # MEMORY_MAP.md's addresses, and the bucket pass's card parts
    # after the replay's in $F900-$FEFF (speed wave 2: the replay's
    # per-row copy image and jtent moved to TEXBLK's slack after the row
    # blocks, $DBD1-$DBF8, to make room in the $F900 part: RCODE
    # $F900-$FD89, BKNEAR $FD8A-$FE40 in the release build (render.mk's
    # default, the disk's), $F900-$FD86 and $FD87-$FE3D without -D
    # RELEASE. RC's size is the region's; the game's card needs the part
    # to end before $FE45 (the CPU copy's AMEMCPUF, docs/MEMORY_MAP.md:
    # playdisk.py checks it) and the kernel's bytes at $FE7B
    # (playlayout.py))
    RZP:     start = $0048, size = $0028, type = rw, file = "";
    RSCR:    start = $17C2, size = $003E, type = rw, file = "";
    MAINTAB: start = $0800, size = $0400, type = ro, file = "%O.m08";
    AUXCODE: start = $0200, size = $00C0, type = ro, file = "%O.a02";
    AUXTAB:  start = $0800, size = $0400, type = ro, file = "%O.a08";
    TEXBLK:  start = $D000, size = $0C00, type = ro, file = "%O.lc2",
             fill = yes;
    FILLE:   start = $DC00, size = $0100, type = ro, file = "%O.lc2",
             fill = yes;
    FILLO:   start = $DD00, size = $0100, type = ro, file = "%O.lc2",
             fill = yes;
    HOT:     start = $DE00, size = $0200, type = ro, file = "%O.lc2",
             fill = yes;
    RC:      start = $F900, size = $0600, type = ro, file = "%O.rc";
}
SEGMENTS {
    MATHLC:  load = LC1, type = ro;
    MATHFAR: load = FAR, type = ro;
    RFAR:    load = FAR, type = rw;
    RLOAD:   load = FAR, type = ro;
    MFAR:    load = FAR, type = rw, optional = yes;
    MATHW:   load = W,   type = ro, define = yes;
    AUXW:    load = W,   type = rw, define = yes;
    RENDERW: load = W,   type = rw, define = yes;
    MASKW:   load = WM,  type = rw, define = yes, optional = yes;
    BKFAR:   load = WM,  run = BFAR, type = ro, define = yes,
             optional = yes;
    BKFAR2:  load = WM,  run = BFAR2, type = ro, define = yes,
             optional = yes;
    DRIVER:  load = LCE, type = rw;
    DESC:    load = LCE, type = bss, define = yes;
    VECTORS: load = VEC, type = ro, optional = yes;
    BOOT:    load = BOOT, type = rw, optional = yes;
    RZP:     load = RZP,     type = zp, optional = yes;
    RSCR:    load = RSCR,    type = bss, optional = yes;
    MAINTAB: load = MAINTAB, type = ro, optional = yes;
    AUXCODE: load = AUXCODE, type = ro, optional = yes;
    AUXTAB:  load = AUXTAB,  type = ro, optional = yes;
    TEXBLK:  load = TEXBLK,  type = ro, optional = yes;
    FILLE:   load = FILLE,   type = ro, optional = yes;
    FILLO:   load = FILLO,   type = ro, optional = yes;
    RHOT:    load = HOT,     type = ro, optional = yes;
    RCODE:   load = RC,      type = ro, define = yes, optional = yes;
    BKNEAR:  load = RC,      type = ro, define = yes, optional = yes;
    BKCARD:  load = RC,      type = ro, define = yes, optional = yes;
}
