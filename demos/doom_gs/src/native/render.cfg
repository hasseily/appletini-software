# ld65 map of the native renderer's a2vm builds (docs/RENDER.md 3.1, 3.4):
# every region of docs/MEMORY_MAP.md the front end takes, so an overflow
# of a budget fails the link. The zero page, the frame block and the
# tables are rlayout.inc's (tools/native/rlayout.py), not segments.
MEMORY {
    # W, the render window: code, $6000-$AFBF (the per-level tables
    # $AFC0-$B8FF and the batch buffer come after it: wtables.img)
    W:    start = $6000, size = $4FC0, file = "%O.w";
    # main card bank 1: the products ($D800-$DBFF, MEMORY_MAP 4.2)
    LC1:  start = $D800, size = $0400, file = "%O.lc1";
    # the far layer's $DC00-$DFFF: MATHFAR, then far.s
    FAR:  start = $DC00, size = $0400, file = "%O.far";
    # the card's $E000 part: the test driver (not the game's)
    LCE:  start = $E000, size = $1800, file = "%O.lce";
}
SEGMENTS {
    MATHLC:  load = LC1, type = ro;
    MATHFAR: load = FAR, type = ro;
    RFAR:    load = FAR, type = rw;
    RLOAD:   load = FAR, type = ro;
    RENDERW: load = W,   type = rw;
    MATHW:   load = W,   type = ro, define = yes;
    DRIVER:  load = LCE, type = rw;
    DESC:    load = LCE, type = bss, define = yes;
}
