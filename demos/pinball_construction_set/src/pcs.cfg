# Linker configuration of the Pinball Construction Set port.
#
# The SYS file loads at $2000. RODATA comes right after the entry code so
# that the read-only tables sit in $2000-$5FFF, the range whose writes the
# virtual TransWarp posts to the 1 MHz bus; code follows (its few
# self-modified operands are the only writes there). Variables live at
# $0C00-$1FFF and the object database at $9C00-$BAFF, both outside the
# posted ranges. $BB00-$BEFF is the ProDOS file buffer during file I/O and
# the render arena otherwise.
SYMBOLS {
    PBBASE:  type = export, value = $9C00;
    PBDX:    type = export, value = $BA40;
}
MEMORY {
    ZP:     file = "", define = yes, start = $0040, size = $0040, type = rw;
    LOW:    file = "", define = yes, start = $0C00, size = $1400, type = rw;
    MAIN:   file = %O, define = yes, start = $2000, size = $7C00, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    CODE:     load = MAIN, type = rw;
    DATA:     load = MAIN, run = LOW, type = rw, define = yes;
    BSS:      load = LOW,  type = bss, define = yes;
}
