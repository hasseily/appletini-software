# Linker config for tests/test_assets.py (py65 checks of build/assets.s).
# The same layout as src/pcs.cfg: zero page $40-$7F, variables at $0C00,
# RODATA and code at $2000. The test fills the auxiliary language card
# from PCS.SPR itself, as src/loader.s would.
MEMORY {
    ZP:     file = "", define = yes, start = $0040, size = $0040, type = rw;
    LOW:    file = "", define = yes, start = $0C00, size = $1400, type = rw;
    MAIN:   file = %O, define = yes, start = $2000, size = $7800, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    RODATA:   load = MAIN, type = ro;
    CODE:     load = MAIN, type = rw;
    BSS:      load = LOW,  type = bss, define = yes;
}
