# Linker config for tests/test_sound.py (py65 unit tests of src/sound.s).
# The same layout as src/pcs.cfg for the port's variables (ZEROPAGE at
# $40-$7F, BSS at $0C00); code and read-only tables at $6000.
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0040, type = rw;
    LOW:  file = "", define = yes, start = $0C00, size = $1400, type = rw;
    MAIN: file = %O, define = yes, start = $6000, size = $4000, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro, optional = yes;
    RODATA:   load = MAIN, type = ro;
    CODE:     load = MAIN, type = rw;
    DATA:     load = MAIN, type = rw, optional = yes;
    BSS:      load = LOW,  type = bss, define = yes;
}
