# ProDOS SYS file at $2000. The image must end below the arena ($9C00),
# which also holds the MLI I/O buffer while the loader runs. BSS sits in main RAM that the accelerator
# does not mirror to the 1 MHz bus.
MEMORY {
    MAIN:   start = $2000, size = $7C00, file = %O;
    BSSMEM: start = $0C00, size = $1400, file = "";
}
SEGMENTS {
    STARTUP: load = MAIN,   type = ro;
    GAME0:   load = MAIN,   type = rw;
    CODE:    load = MAIN,   type = rw;
    RODATA:  load = MAIN,   type = ro;
    LOADER:  load = MAIN,   type = ro;
    BSS:     load = BSSMEM, type = bss;
}
