# Linker config for tests/test_video.py (py65 unit tests of video.s).
# Code and read-only tables at $6000; C globals and test buffers in
# $0C00-$1FFF, like the real game. The test emulates AUX memory as a
# separate bank, so the framebuffer never overlaps main-memory code.
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0800;
    __STACKSTART__: type = weak, value = $B800;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0080, size = $001F;
    LOW:  file = "", define = yes, start = $0C00, size = $1400;
    MAIN: file = %O, define = yes, start = $6000, size = $4000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro, optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw, optional = yes;
    BSS:      load = LOW,  type = bss, define = yes;
}
