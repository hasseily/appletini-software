# Linker config for Appletini Bosconian (docs/DESIGN.md section 2).
#
# The SYS file is linked at $2000 and runs from $2000 (crt0 in STARTUP).
# Code and read-only tables stay in $2000-$BAFF and are never written at
# run time. DATA and BSS run at $0C00-$1FFF so that no game variable
# lives in main $0400-$0BFF or $2000-$5FFF (posted-write regions of the
# virtual TransWarp). crt0 copies DATA from its load image to LOW.
FEATURES {
    STARTADDRESS: default = $2000;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0400;   # cc65 software stack
    __STACKSTART__: type = weak, value = $BF00;   # grows down to $BB00
}
MEMORY {
    ZP:   file = "", define = yes, start = $0080, size = $0020;
    LOW:  file = "", define = yes, start = $0C00, size = $1400;
    MAIN: file = %O, define = yes, start = %S,    size = $9B00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    LOWCODE:  load = MAIN, type = ro,  optional = yes;
    ONCE:     load = MAIN, type = ro,  optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, run = LOW, type = rw, define = yes;
    BSS:      load = LOW,  type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA,
            import = __CALLIRQ__;
}
